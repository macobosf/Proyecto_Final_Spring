info:
  name: Login_Admin
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |
      {
        "email": "admin@academic.test",
        "password": "Password123*"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("accessToken", res.body.accessToken);
        bru.setEnvVar("refreshToken", res.body.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
